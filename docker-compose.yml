version: '3.8'

services:
  beyond-likes:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beyond_likes_server
    ports:
      - "8888:8888"
    volumes:
      - ./storage:/app/storage
    environment:
      - HOST=0.0.0.0
      - PORT=8888
      - WORKERS=4
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: beyond_likes_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - beyond-likes

  grafana:
    image: grafana/grafana:10.2.2
    container_name: beyond_likes_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - prometheus
