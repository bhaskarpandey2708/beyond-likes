<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      padding: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d1117;
      color: #e6edf3;
      margin: 0;
    }
    h3 { margin: 0 0 8px; font-size: 14px; color: #58a6ff; display: flex; align-items: center; gap: 6px; }
    p { font-size: 11px; color: #8b949e; line-height: 1.4; margin-bottom: 12px; }
    .status-pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 600;
      background: rgba(46, 160, 67, 0.15);
      color: #3fb950;
      border: 1px solid rgba(46, 160, 67, 0.3);
    }
    .btn {
      display: block;
      width: 100%;
      text-align: center;
      background: #238636;
      color: white;
      text-decoration: none;
      padding: 6px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h3>🛡️ Beyond Likes</h3>
  <p>Real-time prosocial discourse evaluation and constructive rewrite assistant.</p>
  <div>Engine Status: <span class="status-pill" id="ext-status">Connected</span></div>
  <a class="btn" href="http://localhost:8888" target="_blank">Open Full Workstation</a>
  <script src="popup.js"></script>
</body>
</html>
